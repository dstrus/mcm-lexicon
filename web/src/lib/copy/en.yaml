    other: Not saved. Save writes {count} files to {folder}.
  notSavedBackup:
    one: Not saved. Save writes {count} file to {folder}, backing up the current ones first.
    other: Not saved. Save writes {count} files to {folder}, backing up the current ones first.
  saved: Saved to {folder} at {time}.
  upToDate: The draft matches the files in {folder}. Nothing to save.
  savedBackup: Saved to {folder} at {time}. The previous files are in {backup}.
  discard: Discard changes
  discardNew: Discard the recording
  review: Review changes
  restore: Restore it
  deletes:
    one: The draft deletes this recording. Save removes its {count} file from {folder}, backing it up first.
    other: The draft deletes this recording. Save removes its {count} files from {folder}, backing them up first.
  saveTo: Save to
  overwrite: MO2’s overwrite folder
  data: The Data folder
  otherMod: Another mod folder…
  modName: Mod folder’s name
  folderPath: The folder’s full path
  use: Use
  running: Skyrim is running, so Save waits until you close it.
  chooseFolder: Choose the folder Save writes to. It writes the recording into a McmRecorder folder there.
  newMod: There’s no mod folder named {mod} yet. Save makes it, and MO2 then lists it as a new mod, disabled. Enable it so the game reads the recording.
  notListed: The mod folder {mod} is there, but this profile doesn’t list it yet. MO2 adds it as a new mod, disabled. Enable it so the game reads the recording, then rescan here.
  disabled: "{mod} is disabled in this profile, so the game won’t read the recording until you enable it in MO2."
  losesTo: "{mod} also has this recording, and its copy wins, so the game replays that one instead."

