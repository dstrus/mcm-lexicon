# Every word MCM Lexicon shows, grouped by page. Components use these as
# m.<group>.<name>, so renaming or removing one means changing them too;
# a mistake fails `make test`.
#
# - {name} is filled in when the message is shown.
# - A message with `one:` and `other:` picks one by its count; {count} is
#   the number, written as the reader's locale writes numbers.
# - Typographic quotes and apostrophes: ’ “ ”.

# Words many pages share.
common:
  next: Next
  previous: Previous
  selected: Selected
  open: Open
  cancel: Cancel
  save: Save
  gameRunning: Skyrim is running, so nothing can be written until you close it.
  noMatch: Nothing matches “{query}”.

shell:
  name: MCM Lexicon
  profile: Profile
  catalog: Catalog
  gameRunning: Skyrim running · read-only
  gameClosed: Skyrim closed
  scanning: Scanning
  scannedAt: Scanned {when}
  notResponding: MCM Lexicon isn’t responding. Check that it’s still running, then reload the page.
  # A request that failed without saying why.
  requestFailed: "{method} {path} failed ({status})"

  # The error page.
  notFound: Not found
  wentWrong: Something went wrong
  backHome: Back to Menus

  theme:
    label: Theme
    auto: Auto
    autoTitle: Follow your system’s dark or light setting
    dark: Dark
    light: Light

# The sections column.
nav:
  sections: Sections
  menus: Menus
  search: Search
  recordings: Recordings
  compare: Compare
  notBuiltYet: Not built yet

# Choosing what to read: a mod list, or a catalog file.
source:
  title: Where is your mod list?
  notFound: >-
    MCM Lexicon didn’t find a mod list next to it. Point it at your Mod
    Organizer 2 instance, the folder holding {ini}, {mods}, and {profiles}; or
    at the game’s {data} folder if you use Vortex or install mods by hand.
  folder: Mod list folder
  profile: Profile
  profileHint: Only with Mod Organizer 2. Left empty, the profile MO2 has selected is read.
  use: Use this list
  orCatalog: Or open a catalog file
  catalogLead: >-
    A catalog is what MCM Lexicon knows about a list, saved as one file, so a
    list can be explored on a machine where it isn’t installed.
  catalogFile: Catalog file
  open: Open this catalog

# Quick find, from any page.
find:
  shortcut: Find
  title: Find a menu
  input: Menu name
  matches: Menus found

# The menus of the list: every MCM it holds.
menus:
  title: Menus
  inInstance: Mod Organizer 2 instance at {path}, profile {profile}
  inData: Data folder at {path}
  inCatalog: Catalog {path}, made from {list}
  which:
    label: Which menus
    all: All
    active: Active
  count:
    one: "{count} menu"
    other: "{count} menus"
  inactiveCount: "{count} inactive"
  filter: Filter by name or mod
  filterLabel: Filter menus
  rescan: Rescan
  firstScan: Reading the list’s menus. This takes a moment on a large list.
  scanFailed: "The scan failed: {error}"
  none: No menus were found in this list. MCM Lexicon looks in each mod’s MCM folder for MCM Helper’s menus.
  pane: Menu

  # The table.
  menu: Menu
  mod: Mod
  kind: Kind
  pages: Pages
  options: Options
  kinds:
    mcmhelper: MCM Helper
    source: Source
    compiled: Compiled
    framework: Framework

  # What isn't read yet.
  notMenus:
    one: "{count} script is built on SkyUI’s menu script, but no quest runs it or it sets no name and no options, so it isn’t a menu the game shows."
    other: "{count} scripts are built on SkyUI’s menu script, but no quest runs them or they set no name and no options, so they aren’t menus the game shows."
  showThem: Show them
  hideThem: Hide them
  notActive: not active
  unreadable:
    one: "{count} file couldn’t be read:"
    other: "{count} files couldn’t be read:"

  # The pane.
  plugin: Plugin
  config: Config
  script: Script
  definedIn: Defined in
  certainty: Certainty
  allExact:
    one: Its option is exact.
    other: All {count} options are exact.
  someUncertain: "{uncertain} of {count} options are built at runtime."
  noOptions: It has no options a recording can set.
  inactive: "Its plugin, {plugin}, isn’t active in this profile, so the game won’t show this menu."
  noPlugin: Its mod has no plugin, so whether the game loads this menu isn’t known.
  pluginGuessed: No quest with this menu’s script was found, so its plugin is the one in its mod named most like it.
  nameFromScript: Neither the script nor its quest sets a name, so this menu goes by its script’s. A recording may need the name SkyUI shows instead.
  pagesGuessed: The script builds its page list at runtime, so these pages are the names it checks for. One it builds some other way may be missing.
  framework: "Built on {script}, which was read with it."
  sourceStale: Its mod ships a source from another version than the compiled script the game runs, so this menu was read from the compiled script.
  overridden: Also in {mod}, which loses to this copy.

# One menu: its pages as tabs, and its options.
menu:
  up: Menus
  pages: Pages
  mainPage: Main
  noOptions: This page has nothing a recording can set.
  noPages: This menu has nothing a recording can set.
  pane: Option

  # The table.
  option: Option
  type: Type
  allowed: Allowed
  default: Default
  saved: Saved
  indexOf: "{n} of {count}"

# One option, in the pane.
option:
  selector: Selector
  type: Type
  index: Index
  indexOf: "{n} of the options with this label and type on this page; a recording says which"
  range: Range
  shownAs: Shown as {example}
  choices: Choices
  default: Default
  saved: Saved
  setting: Setting
  definedIn: Defined in
  help: In the menu
  pattern: This label is built while the game runs, so a recording can only match it with a *wildcard* around its fixed parts.
  unknown: This label is only known while the game runs, so a recording can’t name it.
  stepper: A stepper moves to its next choice on each click, so a recording can only click it.
  repeats: The menu adds this option once for each of something the game holds, so it can appear several times, and a recording says which by its index.
  savedNote: Your saved value, {value}, differs from the mod’s default.
  types:
    toggle: Toggle
    slider: Slider
    menu: Menu
    keymap: Key
    color: Color
    input: Text input
    text: Text
    stepper: Stepper

# How values read.
values:
  "on": "On"
  "off": "Off"
  empty: (empty)
  noLabel: (no label)
  runtime: (built at runtime)
  edgeSpace: Ends with a space. MCM Recorder matches it exactly.
  choiceNumber: Choice {n}
  onOrOff: On or off
  range: "{min} to {max} by {step}"
  aNumber: A number
  aChoice: A choice
  andMore: "{shown}, +{count} more"
  aKey: A key
  aColor: A color
  text: Text
  click: Click
  clickToCycle: Click to cycle

# Search across every menu.
search:
  title: Search
  input: Search every menu’s options
  inputLabel: Search options
  lead: Every option in every menu, by its label, its page, its menu, or its mod.
  results:
    one: "{count} option"
    other: "{count} options"
  cut: Showing the first {shown} of {count}. Add a word to narrow it.
  openMenu: Open menu
  page: Page
  pane: Option

# Key names, for keymap options.
keys:
  none: No key
  code: Key {code}
  esc: Esc
  backspace: Backspace
  tab: Tab
  enter: Enter
  space: Space
  capsLock: Caps Lock
  leftShift: Left Shift
  rightShift: Right Shift
  leftCtrl: Left Ctrl
  rightCtrl: Right Ctrl
  leftAlt: Left Alt
  rightAlt: Right Alt
  numpad: Num {key}
  numpadEnter: Num Enter
  numLock: Num Lock
  scrollLock: Scroll Lock
  printScreen: Print Screen
  pause: Pause
  home: Home
  end: End
  pageUp: Page Up
  pageDown: Page Down
  insert: Insert
  delete: Delete
  up: Up
  down: Down
  left: Left
  right: Right
  leftMouse: Left Mouse
  rightMouse: Right Mouse
  middleMouse: Middle Mouse
  mouseButton: Mouse {n}
  wheelUp: Wheel Up
  wheelDown: Wheel Down

# Controls many pages share.
ui:
  shortcuts: Keyboard shortcuts
