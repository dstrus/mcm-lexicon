# Every word MCM Lexicon shows, grouped by page. Components use these as
# m.<group>.<name>, so renaming or removing one means changing them too;
# a mistake fails `make test`.
#
# - {name} is filled in when the message is shown.
# - A message with `one:` and `other:` picks one by its count; {count} is
#   the number, written as the reader's locale writes numbers.
# - Typographic quotes and apostrophes: ’ “ ”.

# Words many pages share.
common:
  next: Next
  previous: Previous
  selected: Selected
  open: Open
  cancel: Cancel
  save: Save
  gameRunning: Skyrim is running, so nothing can be written until you close it.
  noMatch: Nothing matches “{query}”.
  # A file packed in a Bethesda archive (.bsa), after the file's path.
  inArchive: in {archive}

shell:
  name: MCM Lexicon
  recording: Adding to
  chooseRecording: Choose a recording
  disabledOption: "{name} (mod disabled)"
  recordingTitle: The recording A adds steps to, from any menu or search result
  recordingReadOnly: Recording
  recordingReadOnlyTitle: The recording to look at; turn on editing to add to it
  mode: Read-only or editing
  session: Editing session
  readOnlyNote: Nothing can be changed until you turn on editing.
  readOnly: Read-only
  editing: Editing
  readOnlyTitle: Nothing can be changed. Turn on editing to make and change recordings.
  editingTitle: Every change goes to the draft until you save it, here or on the Changes page.
  leaveTitle: The draft has changes
  leaveSays:
    one: The draft changes {count} recording, and none of it is saved. Review and save it first, or discard it to go back to read-only.
    other: The draft changes {count} recordings, and none of it is saved. Review and save it first, or discard it to go back to read-only.
  review: Review changes
  discardAndLeave: Discard them
  keepEditing: Keep editing
  profile: Profile
  catalog: Catalog
  gameRunning: Skyrim running · read-only
  gameClosed: Skyrim closed
  scanning: Scanning
  scannedAt: Scanned {when}
  notResponding: MCM Lexicon isn’t responding. Check that it’s still running, then reload the page.
  # A request that failed without saying why.
  requestFailed: "{method} {path} failed ({status})"

  # The error page.
  notFound: Not found
  wentWrong: Something went wrong
  backHome: Back to Menus

  theme:
    label: Theme
    auto: Auto
    autoTitle: Follow your system’s dark or light setting
    dark: Dark
    light: Light

# The sections column.
nav:
