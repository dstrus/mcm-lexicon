# How steps read.
steps:
  click: Click
  clickRight: Click, by value
  wontReplay:
    one: "{count} won’t replay"
    other: "{count} won’t replay"
  uncheckedCount:
    one: "{count} unchecked"
    other: "{count} unchecked"
  words:
    notFound: Not found
    notAllowed: Not allowed
    modMissing: Mod missing
    unchecked: Unchecked
  says:
    matched: The catalog has this option, and the value is one it allows.
    range: The option is there, but {value} is outside its range.
    choice: The option is there, but “{value}” isn’t one of its entries.
    disabled: The menu shows this option greyed out, so MCM Recorder can’t select it, and the step does nothing.
    modMissing: There’s no menu named “{mod}” in this list, so MCM Recorder skips the step.
    inactive: The menu “{mod}” is in the list, but its plugin isn’t active, so the game won’t show it.
    unchecked: The catalog doesn’t know all of this menu’s options, so a miss here proves nothing.
    right: This step finds its option by the value shown on its right, and this page has values built at runtime or changed as the menu is used, so a miss here proves nothing.
    value: This step finds its option by its value, and no text option on this page shows “{value}”.
    page: The menu has no page named “{page}”.
    option: The page has no option of this type with this selector.
    index: There are fewer options with this selector than its index, {index}, says.

# The editor's Draft Rule line, and where Save writes.
