# Builds a release's downloads when a version tag (v0.1.0, v0.2.0-beta.1,
# and so on) is pushed, and attaches them to a draft release for that tag,
# with the annotated tag's message as its notes. Publishing the draft makes
# it the latest release, which the site's download links point to.
name: Release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  release:
    # macOS, for lipo and codesign; the Windows and Linux builds cross-compile.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # The latest patch release, rather than go.mod's minimum.
          go-version: '1.26'
          check-latest: true
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test
        run: make test
      # The downloads carry the notices written here, so they name the Go
      # release that built them, which can be newer than the committed copy's.
      - name: Check that THIRD_PARTY_NOTICES.txt is current
        run: make notices && git diff --exit-code -I '^The Go standard library' -I '^  The Go standard library' THIRD_PARTY_NOTICES.txt
      - name: Build the downloads
        run: make release VERSION="$GITHUB_REF_NAME"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/MCMLexicon-windows-x64.zip dist/MCMLexicon-macos.zip dist/MCMLexicon-linux-x64.tar.gz dist/SHA256SUMS
          --draft --latest --verify-tag --notes-from-tag
          --title "MCM Lexicon ${GITHUB_REF_NAME#v}"
