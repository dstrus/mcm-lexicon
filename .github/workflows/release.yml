# Builds a release's downloads, for Windows, when a version tag (v0.1.0,
# v0.2.0-beta.1, and so on) is pushed: the app, and the capture plugin
# (skse.yml). It attaches them to a draft release
# for that tag, with notes from that version's section of CHANGELOG.md.
# Publishing the draft makes it the latest release, which the site's
# download links point to.
name: Release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
jobs:
  # The capture plugin builds on Windows, in its own workflow.
  capture:
    uses: ./.github/workflows/skse.yml
    with:
      version: ${{ github.ref_name }}
  release:
    needs: capture
    # The Windows build cross-compiles, so any runner does.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          # The latest patch release, rather than go.mod's minimum.
          go-version: '1.26'
          check-latest: true
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test
        run: make test
      # The downloads carry the notices written here, so they name the Go
      # release that built them, which can be newer than the committed copy's.
      - name: Check that THIRD_PARTY_NOTICES.txt is current
        run: make notices && git diff --exit-code -I '^The Go standard library' -I '^  The Go standard library' THIRD_PARTY_NOTICES.txt
      - name: Build the download
        run: make release VERSION="$GITHUB_REF_NAME"
      # After the download, which empties dist/: the capture plugin's zip,
      # and its line in SHA256SUMS.
      - name: Add the capture plugin
        uses: actions/download-artifact@v4
        with:
          name: capture-plugin
          path: dist
      - name: Add the capture plugin's checksum
        run: cd dist && shasum -a 256 MCMLexicon-Capture.zip >> SHA256SUMS
      - name: Write the release notes
        run: make release-notes VERSION="$GITHUB_REF_NAME"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/MCMLexicon-windows-x64.zip dist/MCMLexicon-Capture.zip dist/SHA256SUMS
          --draft --latest --verify-tag --notes-file dist/release-notes.md
          --title "MCM Lexicon ${GITHUB_REF_NAME#v}"
